<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --text: #000000; --muted: #737373;
    --border: #dbdbdb; --hover: #f2f2f2; --btn: #efefef; --btn-hover: #dbdbdb;
    --blue: #0095f6; --red: #ff3040; --link: #00376b;
    --ring: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --surface: #000; --text: #f5f5f5; --muted: #a8a8a8;
      --border: #262626; --hover: #1a1a1a; --btn: #363636; --btn-hover: #262626; --link: #e0f1ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000; --surface: #000; --text: #f5f5f5; --muted: #a8a8a8;
    --border: #262626; --hover: #1a1a1a; --btn: #363636; --btn-hover: #262626; --link: #e0f1ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 Inter, -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  body.locked { overflow: hidden; }
  button { touch-action: manipulation; }
  button:active { opacity: .6; }
  button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .avatar { border-radius: 50%; object-fit: cover; display: block; background: var(--hover); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 245px; padding: 24px 12px 20px;
    border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); z-index: 10;
  }
  .logo { font-family: "Grand Hotel", cursive; font-size: 30px; padding: 6px 12px 28px; }
  .nav-item { display: flex; align-items: center; gap: 16px; padding: 12px; border-radius: 8px; font-size: 16px; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--hover); }
  .nav-item .badge { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; }
  .nav-spacer { flex: 1; }

  /* ---------- Profile ---------- */
  main { margin-left: 245px; padding: 30px 20px 0; }
  .profile { max-width: 935px; margin: 0 auto; }
  .mockup-note { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 32px; }
  .header { display: flex; align-items: flex-start; gap: 30px; margin-bottom: 44px; }
  .pic { flex: 0 0 290px; display: flex; justify-content: center; }
  .pic .ring { padding: 3px; border-radius: 50%; background: var(--ring); cursor: pointer; }
  .pic .ring.seen { background: var(--border); }
  .pic .avatar { width: 150px; height: 150px; border: 4px solid var(--bg); }
  .info { flex: 1; min-width: 0; }
  .row1 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .username { font-size: 20px; font-weight: 400; margin-right: 12px; display: flex; align-items: center; gap: 6px; }
  .verified { width: 18px; height: 18px; }
  .btn { background: var(--btn); padding: 7px 16px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1877f2; }
  .btn.icon { padding: 7px 8px; }
  .btn svg { width: 16px; height: 16px; }
  .more-btn svg { width: 28px; height: 28px; }
  .stats { display: flex; gap: 40px; font-size: 16px; margin-bottom: 20px; list-style: none; }
  .stats b { font-weight: 600; }
  .bio .name { font-weight: 600; }
  .bio a { color: var(--link); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
  .bio a svg { width: 14px; height: 14px; }

  /* ---------- Highlights ---------- */
  .highlights { display: flex; gap: 32px; padding: 0 44px 44px; overflow-x: auto; scrollbar-width: none; }
  .highlights::-webkit-scrollbar { display: none; }
  .hl { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; width: 87px; font-size: 12px; font-weight: 600; }
  .hl span { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .hl .circle { width: 87px; height: 87px; border-radius: 50%; padding: 3px; border: 1px solid var(--border); }
  .hl .circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

  /* ---------- Tabs + grid ---------- */
  .tabs { display: flex; justify-content: center; gap: 60px; border-top: 1px solid var(--border); }
  .tab { display: flex; align-items: center; gap: 6px; height: 52px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--muted); border-top: 1px solid transparent; margin-top: -1px; }
  .tab svg { width: 12px; height: 12px; }
  .tab.active { color: var(--text); border-top-color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding-bottom: 40px; }
  .tile { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--hover); cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .type { position: absolute; top: 8px; right: 8px; color: #fff; display: flex; gap: 6px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .tile .type svg { width: 20px; height: 20px; }
  .tile .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); color: #fff; display: flex; align-items: center; justify-content: center; gap: 28px; font-weight: 700; font-size: 16px; opacity: 0; transition: opacity .15s; }
  .tile .overlay span { display: flex; align-items: center; gap: 6px; }
  .tile .overlay svg { width: 20px; height: 20px; fill: #fff; stroke: none; }
  @media (hover: hover) { .tile:hover .overlay { opacity: 1; } }
  /* Seamless panorama: each tile shows its third of one wide image */
  .pano-frame { position: relative; overflow: hidden; }
  .card .photo.pano-frame { aspect-ratio: 3 / 4; }
  img.pano { position: absolute; top: 0; left: calc(var(--k) * -100%); width: 300% !important; max-width: none; height: 100% !important; aspect-ratio: auto !important; object-fit: cover; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 16px; color: var(--muted); }
  .empty h3 { color: var(--text); font-size: 24px; font-weight: 800; margin-bottom: 8px; }

  /* ---------- Post modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 40px; z-index: 50; }
  .modal.open { display: flex; }
  .modal .close { position: fixed; top: 16px; right: 16px; color: #fff; }
  .modal .close svg { width: 28px; height: 28px; }
  .card { display: flex; background: var(--surface); border-radius: 4px; overflow: hidden; max-width: 1000px; width: 100%; max-height: calc(100vh - 80px); }
  .card .photo { flex: 1 1 60%; background: #000; min-width: 0; position: relative; }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 3 / 4; }
  .card .side { flex: 0 0 400px; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  .side .head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .side .head .verified { width: 14px; height: 14px; }
  .side .head .f { color: var(--blue); }
  .side .body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .side .c { display: flex; gap: 12px; }
  .side .c b { font-weight: 600; margin-right: 4px; }
  .side .c small { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .side .actions { display: flex; gap: 14px; padding: 10px 16px 6px; border-top: 1px solid var(--border); }
  .side .actions .sv { margin-left: auto; }
  .side .liked svg { fill: var(--red); stroke: var(--red); }
  .side .saved svg { fill: currentColor; }
  .side .date { padding: 0 16px 14px; color: var(--muted); font-size: 12px; }
  .side .add { display: flex; border-top: 1px solid var(--border); padding: 12px 16px; }
  .side .add input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; }
  .side .add button { color: var(--blue); font-weight: 600; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: #262626; color: #fff; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  .topbar, .bottombar, .stats-m { display: none; }
  @media (max-width: 1000px) {
    .sidebar { width: 73px; } .sidebar .label, .sidebar .badge { display: none; }
    .logo { font-size: 0; } .logo::before { content: "📷"; font-size: 24px; }
    main { margin-left: 73px; }
    .pic { flex-basis: 200px; }
    .card .side { flex-basis: 320px; }
  }
  @media (max-width: 767px) {
    .sidebar { display: none; }
    main { margin: 0; padding: calc(52px + env(safe-area-inset-top)) 0 calc(52px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; position: fixed; top: 0; left: 0; right: 0; height: calc(52px + env(safe-area-inset-top)); align-items: center; justify-content: space-between; padding: env(safe-area-inset-top) 16px 0; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; font-weight: 700; font-size: 16px; }
    .topbar span { display: flex; align-items: center; gap: 4px; }
    .topbar .verified { width: 14px; height: 14px; }
    .bottombar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: calc(52px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); justify-content: space-around; align-items: center; background: var(--surface); border-top: 1px solid var(--border); z-index: 10; }
    .header { gap: 24px; padding: 16px 16px 12px; margin-bottom: 0; align-items: center; }
    .pic { flex: 0 0 auto; }
    .pic .avatar { width: 86px; height: 86px; border-width: 3px; }
    .username { display: none; }
    .info .row1, .info .bio { display: none; }
    .info .stats { display: flex; justify-content: space-around; gap: 0; margin: 0; text-align: center; font-size: 14px; }
    .info .stats b { display: block; font-size: 16px; }
    .info .stats li { flex: 1; min-width: 0; font-size: 13px; }
    .header { gap: 16px; }
    .bio-m { padding: 0 16px 12px; }
    .row-m { display: flex; gap: 6px; padding: 0 16px 16px; flex-wrap: wrap; }
    .row-m .btn { flex: 1; justify-content: center; }
    .row-m .btn.icon { flex: 0 0 auto; }
    .highlights { gap: 16px; padding: 0 16px 20px; }
    .hl { width: 64px; } .hl .circle { width: 64px; height: 64px; }
    .tabs { gap: 0; justify-content: space-around; }
    .tab span { display: none; }
    .tab svg { width: 24px; height: 24px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .modal { padding: 0; }
    .card { flex-direction: column; max-height: 100dvh; height: 100dvh; border-radius: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
    .modal .close { top: calc(12px + env(safe-area-inset-top)); z-index: 2; background: rgba(0,0,0,.45); border-radius: 50%; padding: 4px; }
    .toast { bottom: calc(68px + env(safe-area-inset-bottom)); }
    .side .add { position: sticky; bottom: 0; background: var(--surface); }
    .card .photo img { aspect-ratio: 3 / 4; height: auto; }
    .card .side { flex: none; border-left: 0; }
    .card .photo { flex: none; }
  }
  @media (min-width: 768px) { .bio-m, .row-m { display: none; } }
  @media (max-width: 400px) {
    .pic .avatar { width: 64px; height: 64px; }
    .info .stats li { font-size: 12px; }
    .info .stats b { font-size: 15px; }
  }
</style>
</head>

<script>

    username: "darumajeans",

  const highlights = [
    ["FAQ", "images/highlight-01.jpg"],
    ["⚠️SIZES", "images/highlight-02.jpg"],

    ["AFTERCARE", "images/highlight-10.jpg"],
  ];
  // 12 brand posts, newest first; the first three are pinned. Matches image-prompts.md.
  // Put your images in my-posts/ named 01.jpg … 12.jpg (or .png / .webp).
  // Any number that's missing falls back to the original photo in images/.
  const posts = [
    { n: 1, date: "October 18, 2026", label: "Denim on a chair", caption: "Raw selvedge with a red Daruma — the start of something personal." },
    { n: 2, date: "October 16, 2026", label: "Head-to-toe denim", caption: "Head-to-toe denim, with Mount Fuji, a bonsai and a Daruma stitched on the leg." },
    { n: 3, date: "October 14, 2026", label: "Your design, your pair", caption: "Cherry blossoms, a crescent moon and koi — every detail chosen by you, stitched in our Harajuku workshop." },
    { n: 4, date: "October 12, 2026", label: "Tokyo streets", caption: "Tokyo streets, your own embroidery." },
    { n: 5, date: "October 10, 2026", label: "Daruma Jeans", caption: "Daruma Jeans. Made in Japan. Crafted by You." },
    { n: 6, date: "October 8, 2026", label: "Crane on the hem", caption: "A white crane, right above the cuff. Pick any design and put it anywhere you like." },
    { n: 7, date: "October 6, 2026", label: "Golden tiger", caption: "Golden tiger, ready for ramen. Your jeans, your story." },
    { n: 8, date: "October 4, 2026", label: "Cuffed and pressed", caption: "Cuffed, pressed and stitched with your story." },
    { n: 9, date: "October 2, 2026", label: "Slow afternoons", caption: "Slow afternoons in jeans you designed yourself. Book via the link in bio." },
    { n: 10, date: "September 30, 2026", label: "Folded and finished", caption: "Folded, finished, yours — with a Daruma for good luck. Made in Japan. Crafted by You." },
  ];
  const pad = n => String(n).padStart(2, "0");
  // Candidate image paths for a post, tried in order
  // Seamless row: posts with `pano` (0 = left, 1 = middle, 2 = right) each show one third of
  // my-posts/panorama.jpg (9:4, e.g. 3240 × 1440). Without a panorama they use their own image.
  const exts = ["jpg", "png", "webp"];
  // Posts without an image in my-posts/ show a white placeholder with the post number and label
  const placeholder = p => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">` +
    `<rect width="1080" height="1440" fill="#ffffff"/>` +
    `<text x="540" y="680" text-anchor="middle" font-family="Avenir Next, Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="44" letter-spacing="6" fill="#9a9a9a">POST ${pad(p.n)}</text>` +
    `<text x="540" y="770" text-anchor="middle" font-family="Avenir Next, Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" fill="#32446d">${esc(p.label || "Sample text")}</text>` +
    `</svg>`);
  // ?t= makes the browser reload images every visit, so swapped or moved photos show immediately
  const bust = `?t=${Date.now()}`;
  const srcs = p => (p.pano !== undefined ? exts.map(ext => `my-posts/panorama.${ext}${bust}`) : [])
    .concat(exts.map(ext => `my-posts/${pad(p.n)}.${ext}${bust}`), placeholder(p));
  function setSrc(img, list, p) {
    let i = 0;
    img.style.setProperty("--k", p.pano ?? 0);
    img.onload = () => {
      const pano = img.src.includes("/panorama.");
      img.classList.toggle("pano", pano);
      img.parentElement.classList.toggle("pano-frame", pano);
    };
    img.onerror = () => { if (++i < list.length) img.src = list[i]; else img.onerror = null; };
    img.src = list[0];
  }
  // ===============================================================================================

  const $ = id => document.getElementById(id);
  const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : n.toLocaleString("en-US");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const icon = id => `<svg><use href="#i-${id}"/></svg>`;

  // Header
  $("pic").src = profile.avatar;
  $("username").textContent = $("topName").textContent = profile.username;
  let followers = profile.followers;
  const renderStats = () => {
    $("stats").innerHTML = `<li><b>${compact(profile.posts)}</b> posts</li><li><b>${compact(followers)}</b> followers</li><li><b>${compact(profile.following)}</b> following</li>`;
  };
  renderStats();
  const bioHTML = `<div class="name">${esc(profile.name)}</div><div>${esc(profile.bio).replace(/\n/g, "<br>")}</div><a href="#">${icon("link")}${esc(profile.link)}</a>`;
  $("bio").innerHTML = $("bioM").innerHTML = bioHTML;

  // Highlights
  const hlHTML = highlights.map(([t, src]) => `<button class="hl" data-toast="Opens “${esc(t)}” highlight"><div class="circle"><img src="${src}" alt=""></div><span>${esc(t)}</span></button>`);
  $("highlights").innerHTML = hlHTML.join("");

  // Grid
  let current = posts;
  const emptyMsg = {
    reels: `<h3>No reels yet</h3><p>When ${profile.username} shares reels, they'll appear here.</p>`,
    tagged: `<h3>No photos</h3><p>When people tag ${profile.username} in photos, they'll appear here.</p>`
  };
  function renderGrid(list, tab) {
    current = list;
    $("grid").innerHTML = list.length ? list.map((p, i) => `
      <div class="tile" data-i="${i}">
        <img alt="">
        ${(p.pinned && tab === "posts") || p.reel ? `<span class="type">${p.pinned && tab === "posts" ? icon("pin") : ""}${p.reel ? icon("reels") : ""}</span>` : ""}
        <div class="overlay"><span>${icon("solid-heart")}</span><span>${icon("solid-comment")}</span></div>
      </div>`).join("")
      : `<div class="empty">${emptyMsg[tab]}</div>`;
    $("grid").querySelectorAll(".tile img").forEach((img, i) => setSrc(img, srcs(list[i]), list[i]));
  }
  renderGrid(posts, "posts");

  // Post modal
  let open = null;
  function openPost(p) {
    open = p;
    setSrc($("mImg"), srcs(p), p);
    $("mAvatar").src = profile.avatar;
    $("mName").textContent = profile.username;
    $("mDate").textContent = p.date.toUpperCase();
    $("mLike").classList.toggle("liked", !!p.liked);
    $("mSave").classList.toggle("saved", !!p.saved);
    $("mBody").innerHTML = `<div class="c"><img class="avatar" src="${profile.avatar}" width="32" height="32" alt=""><div><b>${profile.username}</b>${esc(p.caption)}</div></div>` +
      (p.mine || []).map(t => `<div class="c"><img class="avatar" src="https://i.pravatar.cc/64?img=12" width="32" height="32" alt=""><div><b>you</b>${esc(t)}<small>now</small></div></div>`).join("");
    $("modal").classList.add("open");
    document.body.classList.add("locked");
  }
  const closeModal = () => { $("modal").classList.remove("open"); document.body.classList.remove("locked"); };
  $("closeModal").onclick = closeModal;
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  $("mLike").onclick = () => { open.liked = !open.liked; $("mLike").classList.toggle("liked", open.liked); };
  $("mSave").onclick = () => { open.saved = !open.saved; $("mSave").classList.toggle("saved", open.saved); toast(open.saved ? "Saved" : "Removed from saved"); };
  $("mForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = e.target.querySelector("input"), t = input.value.trim();
    if (!t) return;
    (open.mine ||= []).push(t); input.value = ""; openPost(open);
  });

  // Follow state (shared by all follow buttons)
  let following = false;
  function setFollow(on) {
    following = on;
    followers += on ? 1 : -1;
    renderStats();
    document.querySelectorAll(".follow-btn").forEach(b => {
      b.classList.toggle("primary", !on);
      b.innerHTML = on ? `Following ${icon("down")}` : "Follow";
    });
    document.querySelectorAll(".follow-btn-small").forEach(b => { b.textContent = on ? "Following" : "Follow"; b.style.color = on ? "var(--text)" : ""; });
  }

  // Clicks
  document.addEventListener("click", e => {
    const el = e.target.closest("button, .tile, [data-toast]");
    if (!el) return;
    if (el.classList.contains("tile")) return openPost(current[el.dataset.i]);
    if (el.classList.contains("follow-btn") || el.classList.contains("follow-btn-small")) return setFollow(!following);
    if (el.classList.contains("tab")) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === el));
      const k = el.dataset.tab;
      return renderGrid({ posts, reels: posts.filter(p => p.reel), tagged: [] }[k], k);
    }
    if (el.id === "picRing") el.classList.add("seen");
    if (el.dataset.toast) toast(el.dataset.toast);
  });

  // Toast
  let tt;
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2000); }
</script>
</body>
</html>
