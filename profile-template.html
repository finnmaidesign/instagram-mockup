<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Profile Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --text: #000000; --muted: #737373;
    --border: #dbdbdb; --hover: #f2f2f2; --btn: #efefef; --btn-hover: #dbdbdb;
    --blue: #0095f6; --red: #ff3040; --link: #00376b;
    --ring: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --surface: #000; --text: #f5f5f5; --muted: #a8a8a8;
      --border: #262626; --hover: #1a1a1a; --btn: #363636; --btn-hover: #262626; --link: #e0f1ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000; --surface: #000; --text: #f5f5f5; --muted: #a8a8a8;
    --border: #262626; --hover: #1a1a1a; --btn: #363636; --btn-hover: #262626; --link: #e0f1ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 Inter, -apple-system, system-ui, sans-serif; }
  button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .avatar { border-radius: 50%; object-fit: cover; display: block; background: var(--hover); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 245px; padding: 24px 12px 20px;
    border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); z-index: 10;
  }
  .logo { font-family: "Grand Hotel", cursive; font-size: 30px; padding: 6px 12px 28px; }
  .nav-item { display: flex; align-items: center; gap: 16px; padding: 12px; border-radius: 8px; font-size: 16px; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { font-weight: 700; }
  .nav-item.active .avatar { outline: 2px solid var(--text); outline-offset: 1px; }
  .nav-item .badge { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; }
  .nav-spacer { flex: 1; }

  /* ---------- Profile ---------- */
  main { margin-left: 245px; padding: 30px 20px 0; }
  .profile { max-width: 935px; margin: 0 auto; }
  .header { display: flex; align-items: flex-start; gap: 30px; margin-bottom: 44px; }
  .pic { flex: 0 0 290px; display: flex; justify-content: center; }
  .pic .ring { padding: 3px; border-radius: 50%; background: var(--ring); }
  .pic .avatar { width: 150px; height: 150px; border: 4px solid var(--bg); }
  .info { flex: 1; min-width: 0; }
  .row1 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .username { font-size: 20px; font-weight: 400; margin-right: 12px; display: flex; align-items: center; gap: 6px; }
  .verified { width: 18px; height: 18px; }
  .btn { background: var(--btn); padding: 7px 16px; border-radius: 8px; font-weight: 600; }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1877f2; }
  .btn.icon { padding: 7px 8px; }
  .btn.icon svg { width: 18px; height: 18px; }
  .btn.feature { background: var(--ring); color: #fff; display: flex; align-items: center; gap: 6px; }
  .btn.feature svg { width: 16px; height: 16px; }
  .stats { display: flex; gap: 40px; font-size: 16px; margin-bottom: 20px; list-style: none; }
  .stats b { font-weight: 600; }
  .bio .name { font-weight: 600; }
  .bio .cat { color: var(--muted); }
  .bio a { color: var(--link); font-weight: 600; }

  /* ---------- Highlights ---------- */
  .highlights { display: flex; gap: 40px; padding: 0 44px 44px; overflow-x: auto; scrollbar-width: none; }
  .highlights::-webkit-scrollbar { display: none; }
  .hl { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; font-size: 12px; font-weight: 600; }
  .hl .circle { width: 87px; height: 87px; border-radius: 50%; padding: 3px; border: 1px solid var(--border); }
  .hl .circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .hl.new .circle { display: grid; place-items: center; }
  .hl.new svg { width: 44px; height: 44px; stroke-width: 1; color: var(--muted); }
  .hl.feature .circle { border: 2px dashed #d62976; display: grid; place-items: center; background: linear-gradient(135deg, rgba(254,218,117,.15), rgba(214,41,118,.15), rgba(79,91,213,.15)); }
  .hl.feature svg { width: 36px; height: 36px; color: #d62976; }

  /* ---------- Tabs + grid ---------- */
  .tabs { display: flex; justify-content: center; gap: 60px; border-top: 1px solid var(--border); }
  .tab { display: flex; align-items: center; gap: 6px; height: 52px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--muted); border-top: 1px solid transparent; margin-top: -1px; }
  .tab svg { width: 12px; height: 12px; }
  .tab.active { color: var(--text); border-top-color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-bottom: 40px; }
  .tile { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--hover); cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .type { position: absolute; top: 8px; right: 8px; color: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .tile .type svg { width: 20px; height: 20px; }
  .tile .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); color: #fff; display: flex; align-items: center; justify-content: center; gap: 28px; font-weight: 700; font-size: 16px; opacity: 0; transition: opacity .15s; }
  .tile .overlay span { display: flex; align-items: center; gap: 6px; }
  .tile .overlay svg { width: 20px; height: 20px; fill: #fff; stroke: none; }
  .tile:hover .overlay { opacity: 1; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 16px; color: var(--muted); }
  .empty h3 { color: var(--text); font-size: 24px; font-weight: 800; margin-bottom: 8px; }

  /* ---------- Post modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 40px; z-index: 50; }
  .modal.open { display: flex; }
  .modal .close { position: fixed; top: 16px; right: 16px; color: #fff; }
  .modal .close svg { width: 28px; height: 28px; }
  .card { display: flex; background: var(--surface); border-radius: 4px; overflow: hidden; max-width: 1000px; width: 100%; max-height: calc(100vh - 80px); }
  .card .photo { flex: 1 1 60%; background: #000; min-width: 0; }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 3 / 4; }
  .card .side { flex: 0 0 400px; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  .side .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .side .body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .side .c { display: flex; gap: 12px; }
  .side .c b { font-weight: 600; margin-right: 4px; }
  .side .c small { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .side .actions { display: flex; gap: 14px; padding: 10px 16px 6px; border-top: 1px solid var(--border); }
  .side .actions .sv { margin-left: auto; }
  .side .liked svg { fill: var(--red); stroke: var(--red); }
  .side .likes { padding: 0 16px 12px; font-weight: 600; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: #262626; color: #fff; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  .topbar, .bottombar, .stats-m { display: none; }
  @media (max-width: 1000px) {
    .sidebar { width: 73px; } .sidebar .label, .sidebar .badge { display: none; }
    .logo { font-size: 0; } .logo::before { content: "📷"; font-size: 24px; }
    main { margin-left: 73px; }
    .pic { flex-basis: 200px; }
    .card .side { flex-basis: 320px; }
  }
  @media (max-width: 767px) {
    .sidebar { display: none; }
    main { margin: 0; padding: 52px 0 52px; }
    .topbar { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 52px; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; font-weight: 700; font-size: 16px; }
    .bottombar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 52px; justify-content: space-around; align-items: center; background: var(--surface); border-top: 1px solid var(--border); z-index: 10; }
    .header { gap: 24px; padding: 16px; margin-bottom: 0; flex-wrap: wrap; }
    .pic { flex: 0 0 auto; }
    .pic .avatar { width: 77px; height: 77px; border-width: 3px; }
    .info { flex: 1; }
    .username { font-size: 18px; width: 100%; margin: 0; }
    .row1 { margin-bottom: 0; }
    .info .stats, .info .bio { display: none; }
    .bio-m { padding: 0 16px 16px; }
    .highlights { gap: 16px; padding: 0 16px 20px; }
    .hl .circle { width: 64px; height: 64px; }
    .hl.new svg { width: 30px; height: 30px; }
    .stats-m { display: flex; justify-content: space-around; text-align: center; border-top: 1px solid var(--border); padding: 12px 0; list-style: none; color: var(--muted); }
    .stats-m b { display: block; color: var(--text); font-weight: 600; }
    .tabs { gap: 0; justify-content: space-around; }
    .tab span { display: none; }
    .tab svg { width: 24px; height: 24px; }
    .grid { gap: 2px; }
    .modal { padding: 0; }
    .card { flex-direction: column; max-height: 100vh; height: 100vh; border-radius: 0; overflow-y: auto; }
    .card .photo img { aspect-ratio: 1 / 1; height: auto; }
    .card .side { flex: none; border-left: 0; }
  }
  @media (min-width: 768px) { .bio-m { display: none; } }
</style>
</head>

<script>
  // ================= Edit this to customise the profile =================
  const profile = {
    username: "your.username",
    name: "Your Name",
    category: "Digital creator",
    bio: "Short bio line about you ✨\nSecond line — what you post about 📸",
    link: "yourwebsite.com",
    avatar: "https://i.pravatar.cc/300?img=12",
    posts: 128, followers: 12400, following: 384
  };
  const highlights = [
    { title: "Travel", seed: "hl-travel" }, { title: "Food", seed: "hl-food" },
    { title: "Studio", seed: "hl-studio" }, { title: "Friends", seed: "hl-friends" }
  ];
  // Photo IDs come from picsum.photos — swap for your own image URLs if you like.
  // type: "stack" = carousel, "reel" = video
  const posts = [
    { id: 1015, likes: 1284, comments: 42, type: "stack", caption: "Woke up to this view 🏔️" },
    { id: 1080, likes: 842,  comments: 18, caption: "Market haul → dinner 🍓" },
    { id: 1043, likes: 3901, comments: 120, type: "reel", caption: "Golden hour in the city." },
    { id: 1018, likes: 517,  comments: 9, caption: "12km, 3 lakes, 0 regrets." },
    { id: 1025, likes: 2210, comments: 77, caption: "Meet the office manager 🐶" },
    { id: 1035, likes: 690,  comments: 12, type: "stack", caption: "Waterfall chasing" },
    { id: 1039, likes: 1530, comments: 31, caption: "Quiet mornings." },
    { id: 1050, likes: 404,  comments: 6, type: "reel", caption: "Sea breeze 🌊" },
    { id: 1062, likes: 980,  comments: 25, caption: "Little details." },
  ];
  const reels  = posts.filter(p => p.type === "reel");
  const saved  = [{ id: 1069, likes: 3120, comments: 54, caption: "Saved inspo" }, { id: 1074, likes: 870, comments: 11, caption: "Saved inspo" }];
  const tagged = [];
  const commenters = [["nina.photos", 45, "Unreal 😍"], ["studio.kai", 32, "This is so good"], ["chef_daniel", 13, "Need this in my life"]];
  // =======================================================================

  const $ = id => document.getElementById(id);
  const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : n.toLocaleString("en-US");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Header
  $("pic").src = profile.avatar;
  $("username").textContent = $("topName").textContent = profile.username;
  const statsHTML = `<li><b>${compact(profile.posts)}</b> posts</li><li><b>${compact(profile.followers)}</b> followers</li><li><b>${compact(profile.following)}</b> following</li>`;
  $("stats").innerHTML = $("statsM").innerHTML = statsHTML;
  const bioHTML = `<div class="name">${esc(profile.name)}</div><div class="cat">${esc(profile.category)}</div><div>${esc(profile.bio).replace(/\n/g, "<br>")}</div><a href="#">🔗 ${esc(profile.link)}</a>`;
  $("bio").innerHTML = $("bioM").innerHTML = bioHTML;

  // Highlights (+ an idea slot)
  $("highlights").innerHTML =
    highlights.map(h => `<button class="hl" data-toast="Opens “${h.title}” highlight"><div class="circle"><img src="https://picsum.photos/seed/${h.seed}/200/200" alt=""></div>${h.title}</button>`).join("") +
    `<button class="hl feature" data-toast="✨ Your feature as a highlight"><div class="circle"><svg><use href="#i-spark"/></svg></div>Your Idea</button>` +
    `<button class="hl new"><div class="circle"><svg><use href="#i-plus-thin"/></svg></div>New</button>`;

  // Grid
  let current = posts;
  const emptyMsg = {
    saved: ["Save", "Save photos and videos that you want to see again."],
    tagged: ["Photos of you", "When people tag you in photos, they'll appear here."],
    reels: ["Share a moment", "Your reels will appear here."]
  };
  function renderGrid(list, tab) {
    current = list;
    $("grid").innerHTML = list.length ? list.map((p, i) => `
      <div class="tile" data-i="${i}">
        <img src="https://picsum.photos/id/${p.id}/600/800" alt="" loading="lazy">
        ${p.type ? `<span class="type"><svg><use href="#i-${p.type === "reel" ? "play" : "stack"}"/></svg></span>` : ""}
        <div class="overlay"><span><svg><use href="#i-solid-heart"/></svg>${compact(p.likes)}</span><span><svg><use href="#i-solid-comment"/></svg>${p.comments}</span></div>
      </div>`).join("")
      : `<div class="empty"><h3>${emptyMsg[tab][0]}</h3><p>${emptyMsg[tab][1]}</p></div>`;
  }
  renderGrid(posts, "posts");

  // Post modal
  let open = null;
  function openPost(p) {
    open = p;
    $("mImg").src = `https://picsum.photos/id/${p.id}/900/1200`;
    $("mAvatar").src = profile.avatar;
    $("mName").textContent = profile.username;
    $("mLikes").textContent = p.likes.toLocaleString("en-US");
    $("mLike").classList.toggle("liked", !!p.liked);
    const row = (name, img, text, time) => `<div class="c"><img class="avatar" src="https://i.pravatar.cc/64?img=${img}" width="32" height="32" alt=""><div><b>${name}</b>${esc(text)}<small>${time}</small></div></div>`;
    $("mBody").innerHTML = row(profile.username, 12, p.caption, "2d") + commenters.slice(0, 1 + (p.id % 3)).map(([n, img, t], k) => row(n, img, t, `${k + 1}d`)).join("");
    $("modal").classList.add("open");
  }
  const closeModal = () => $("modal").classList.remove("open");
  $("closeModal").onclick = closeModal;
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  $("mLike").onclick = () => {
    open.liked = !open.liked; open.likes += open.liked ? 1 : -1;
    $("mLike").classList.toggle("liked", open.liked);
    $("mLikes").textContent = open.likes.toLocaleString("en-US");
  };

  // Clicks
  document.addEventListener("click", e => {
    const tile = e.target.closest(".tile");
    if (tile) return openPost(current[tile.dataset.i]);
    const tab = e.target.closest(".tab");
    if (tab) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
      const k = tab.dataset.tab;
      return renderGrid({ posts, reels, saved, tagged }[k], k);
    }
    const t = e.target.closest("[data-toast]");
    if (t) toast(t.dataset.toast);
  });

  // Toast
  let tt;
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2000); }
</script>
</body>
</html>
